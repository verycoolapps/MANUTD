name: Azure Web Apps Node Deployment
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Check for build script
        id: check_build
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
            echo "build_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: ${{ steps.check_build.outputs.build_exists == 'true' }}
        run: npm run build
      - name: Azure Web Apps Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
